<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Stars Mini App</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    button {
      background-color: #2ea6ff;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <h2>🌾 VIP Farmer Pack</h2>
  <p>Coins: <strong id="coins">0</strong></p>
  <button onclick="buyItem()">Buy 100 Coins for 1 ⭐</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let coins = 0;

    // Укажите адрес вашего Python-сервера (обязательно HTTPS!)
    const BACKEND_URL = "https://ВАШ_://xn--b1afb6bcb.com";

    async function buyItem() {
      try {
        // 1. Запрашиваем у нашего сервера ссылку на счёт
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });
        const data = await response.json();

        if (!data.invoice_link) {
          tg.showAlert("Ошибка: не удалось создать счёт");
          return;
        }

        // 2. Открываем окно оплаты Telegram Stars внутри Mini App
        tg.openInvoice(data.invoice_link, function(status) {
          if (status === "paid") {
            coins += 100;
            document.getElementById("coins").textContent = coins;
            tg.showAlert("Оплата прошла успешно! +100 монет ⭐");
          } else if (status === "cancelled") {
            tg.showAlert("Оплата отменена.");
          } else {
            tg.showAlert("Ошибка оплаты: " + status);
          }
        });
      } catch (err) {
        tg.showAlert("Нет связи с сервером: " + err.message);
      }
    }
  </script>
</body>
</html>
